[project]
name = "halyk"
version = "0.1.0"
description = "Агент проверки ковенантов по кредитным договорам и реестру транзакций"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "pandas>=2.2",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "tenacity>=9.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "openai>=1.51",
    "anthropic>=0.39",
    "mistralai>=1.2",
]

[project.scripts]
halyk = "halyk.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pandas-stubs>=2.2",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",
    "PL",       # pylint
    "PTH",      # использовать pathlib вместо os.path
    "DTZ",      # даты без таймзоны
    "T20",      # print вне cli
]
ignore = [
    "PLR0913",  # много аргументов — норма для калькуляторов
    # Проект русскоязычный, кириллица в строках и комментариях — норма.
    # Правило про «похожие на латиницу» символы здесь даёт только шум.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/halyk/cli.py" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "mistralai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: требует сеть или ключи API",
]
