name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups --locked

      - name: ruff
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: mypy
        run: uv run mypy src

      - name: схемы не разошлись с моделями
        run: uv run python scripts/export_schemas.py --check

      - name: pytest
        run: uv run pytest -m "not integration" --cov=halyk --cov-report=term-missing

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t halyk-agent .
      - run: docker run --rm halyk-agent version
